# configs/eval/vitb16/lvef-a4c-224px-16f.yaml
#
# Frozen attentive probe for LVEF regression on A4C videos using a pretrained V-JEPA 2.1 ViT-B encoder.
# Validation selects the best probe; `--test_only` evaluates it on the held-out test set. The test runs
# once: it refuses a probe that already has `test_metrics.json`.
#
# Results go to `<folder>/video_classification_frozen/<tag>/`. Once the probe has finished,
# `python -m evals.main --fname <this config> --test_only` scores `dataset_test` with the epoch and
# head chosen on validation (`best.pt`) and writes `test_metrics.json` and `test_predictions.csv`.
# Protocol, metrics and reproduction: `docs/visual_ef_probe.md`.

app: vjepa
eval_name: video_classification_frozen
folder: /your_folder/cooldown/vitb16-continued-224px-16f   # the training run that produced the checkpoint being probed.
tag: lvef-a4c
nodes: 1
tasks_per_node: 4
cpus_per_task: 32
num_workers: 8
resume_checkpoint: true

meta:
  seed: 0                                         # probe initialization, data order and augmentation.
  wandb_project: null
  wandb_entity: mhi_ai
  # wandb_run_name: null

experiment:
  classifier:
    task_type: regression
    probe_type: attentive
    num_heads: 16
    num_probe_blocks: 4
    num_targets: 1

  data:
    dataset_type: VideoDataset
    dataset_train: /your_probe_manifests/train.csv
    dataset_val: /your_probe_manifests/val.csv
    dataset_test: /your_probe_manifests/test.csv   # read only by `--test_only`.
    resolution: 224
    frames_per_clip: 16
    frame_step: 2
    num_segments: 2
    num_views_per_segment: 1
    target_mean: null                             # from `probe_info.json`.
    target_std: null                              # from `probe_info.json`.
    video_index: /your_probe_manifests/video_index.csv  # each video's study and patient, for study-level metrics.

  evaluation:
    low_ef_below: 40                              # reduced EF: a reference EF below 40.
    ef_ranges: [30, 40, 50, 60]                   # error by reference EF range: <30, 30-40, ..., >=60.
    targets:                                      # reference targets per study.
      level: study
      mae_below: 5.0
      auroc_above: 0.95

  optimization:
    batch_size: 4                                 # per GPU.
    num_epochs: 20
    use_bfloat16: true
    # For each experimental setting, train a separate probe, and train all of those probes in parallel using
    # exactly the same frozen backbone features.
    multihead_kwargs:
    - {start_lr: 1.0e-4, lr: 1.0e-4, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {start_lr: 1.0e-4, lr: 1.0e-4, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}
    - {start_lr: 1.0e-4, lr: 1.0e-4, final_lr: 0.0, warmup: 0.0, weight_decay: 0.4, final_weight_decay: 0.4}
    - {start_lr: 5.0e-5, lr: 5.0e-5, final_lr: 0.0, warmup: 0.0, weight_decay: 0.01, final_weight_decay: 0.01}
    - {start_lr: 5.0e-5, lr: 5.0e-5, final_lr: 0.0, warmup: 0.0, weight_decay: 0.1, final_weight_decay: 0.1}
    - {start_lr: 5.0e-5, lr: 5.0e-5, final_lr: 0.0, warmup: 0.0, weight_decay: 0.4, final_weight_decay: 0.4}

model_kwargs:
  checkpoint: /your_folder/cooldown/vitb16-continued-224px-16f/latest.pth.tar
  module_name: evals.video_classification_frozen.modelcustom.vjepa_2_1_encoder
  pretrain_kwargs:
    encoder:                                    # as in the pretraining config's `model` and `data` blocks.
      model_name: vit_base
      checkpoint_key: target_encoder
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      use_sdpa: true
      img_temporal_dim_size: 1
      interpolate_rope: true
      modality_embedding: true
      n_output_distillation: 1
  wrapper_kwargs:
    max_frames: 128
