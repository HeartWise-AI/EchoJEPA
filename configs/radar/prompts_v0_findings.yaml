# RADAR zero-shot prompts for parser findings that have NO label column yet (same schema as prompts_v0.yaml).
#
# The evaluation (evals/radar_frozen/zero_shot_eval.py) refuses this file until the label table holds a column for
# every task: `target` is the task's own name. The labels could come from the parser's facts on the evaluation
# split's captions or from the Labelbox column review; neither exists as a label table today.
#
# STATUS: PROVISIONAL, as prompts_v0.yaml: wording written from the parser's vocabulary (rules v15), checked against
# the parser by tests/data/test_radar_prompts.py, not yet reviewed by a clinician and not mined from reports.

