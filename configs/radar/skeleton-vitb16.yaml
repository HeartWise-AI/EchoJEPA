# configs/radar/skeleton-vitb16.yaml
#
# RADAR video-text contrastive SKELETON on the published EchoJEPA ViT-B (V-JEPA 2.1) encoder. Not a validated recipe:
# it exists so the data path, loss masks, checkpointing and provenance can be exercised end to end.
#
#   python -m app.radar.train --fname <copy of this file with the /your_ paths replaced>
#
# Replace every /your_ path first (the trainer refuses placeholders). Outputs go to meta.output_dir, which must be
# outside the repository. See docs/radar_pilot.md.

meta:
  seed: 0
  output_dir: /your_radar_runs/skeleton-vitb16
  resume: true                              # continue from output_dir/latest.pt when config, encoder and records match.
  # DEVELOPMENT ONLY: train on unreviewed, UNVALIDATED candidate captions when no approved caption exists.
  # Recorded in provenance.json; never use for a model whose results are reported.
  dev_allow_unreviewed_candidates: false

data:
  records: /your_radar_records/clip_records.jsonl   # app/radar/records.py JSONL; must hold no test-split records.
  patient_splits: /your_archive/splits/patient_splits.csv  # the shared split the records were built from (split_source).
  ontology: configs/radar/concepts_v0.yaml          # relative to the repository root.
  validation: true                                  # validation loss on val-split records; logged as a validation use.
  frames_per_clip: 16
  fps: 8                                            # 16 frames at 8 fps, as JEPA pretraining.
  resolution: 224
  temporal_padding: black                           # as the selected pretraining policy (docs/temporal_padding.md).
  random_clip_sampling: true
  batch_size: 32
  num_workers: 8                                     # training and validation load in worker processes,
  loader_timeout: 900                               # so a read stalled this many seconds ends the run (resumable).

visual:
  model_name: vit_base
  # Published EchoJEPA ViT-B (SHA-256 40384a17...; docs/pretraining_baseline.md). An ICM checkpoint is a drop-in
  # replacement here; another model size also needs model_name and embed_dim, which are checked before loading.
  checkpoint: /your_checkpoints/vjepa2_1_vitb_mimic_pt169_c60.pt
  checkpoint_key: target_encoder
  embed_dim: 768
  freeze: true
  pooling: attentive                                # attentive | mean, over non-padding tokens.
  pool_heads: 12
  encoder:                                          # as the pretraining config's model/data blocks and the EF probe.
    patch_size: 16
    tubelet_size: 2
    uniform_power: true
    use_rope: true
    use_sdpa: true
    img_temporal_dim_size: 1
    interpolate_rope: true
    modality_embedding: true
    n_output_distillation: 1

text:
  # Reports and reviewed captions are French: use a French-capable or multilingual encoder snapshot stored locally
  # (e.g. a French biomedical or multilingual sentence encoder); the choice is still open. Nothing is downloaded
  # while local_files_only is true.
  type: huggingface
  name: /your_text_encoder
  local_files_only: true
  max_length: 128
  pooling: mean
  freeze: false

projection:
  dim: 256
  hidden: null                                      # an int adds a GELU MLP instead of a linear projection.

loss:
  init_temperature: 0.07
  learnable_temperature: true
  max_logit_scale: 100.0
  same_study: ignore                                # ignore | positive. Same-study pairs are never negatives.
  equal_concepts: ignore                            # ignore | positive | off, for captions asserting the same concepts.

optimization:
  epochs: 10
  lr: 1.0e-4
  final_lr: 1.0e-6
  warmup_steps: 100
  weight_decay: 0.05
  grad_clip: 1.0
  checkpoint_every: 200
