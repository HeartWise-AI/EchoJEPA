# configs/radar/concepts_v0.yaml
#
# RADAR concept ontology, v0: the clinical concepts a view-specific echo caption may mention, built from
# the PanEcho tasks (evals/video_classification_frozen/modelcustom/PanEcho/content/tasks.pkl), the EchoPrime
# report sections (.../EchoPrime/assets/per_section.json) and the ICM report-export fields.
#
# Two kinds of concept are kept apart on purpose:
#   - structure_visibility: "the mitral valve is visible in this clip";
#   - finding: "severe mitral regurgitation is supported by this clip".
# A visible valve says nothing about its disease, and a reported disease says nothing about what one clip shows.
#
# `potentially_visible_in` is a RELEVANCE PRIOR (views x acquisition categories), not evidence that a finding is
# visible in a given video: candidate captions built from it are unvalidated until a reviewer inspects the clip.
# `required_modality` lists the acquisition categories that can carry the evidence (any one suffices);
# `evidence: measurement` marks values that need calipers, tracing or spectral measurement and therefore cannot be
# confirmed by viewing a clip. Both are kept out of captions and listed as explicit gaps instead.
#
# Numeric `min`/`max` are physiologic bounds: a 0 that stands for "not measured" falls outside them and is reported
# as out of range instead of becoming a value.
# Report sources: `columns` are ICM report-export columns (parse: numeric | scale); `text_fields` are free-text
# findings columns searched with `phrase_hints` (accent- and case-insensitive word prefixes) and `acronyms`
# (case-sensitive whole words). The alias tables under `scales` must be checked against the real value
# distribution of each column before extraction results are trusted.
#
# Bump `version` on any change to ids, values, scales or priors: captions, reviews and checkpoints record it.

schema: radar-concept-ontology
name: concepts_v0
version: 0.1.0
status: draft
languages: [fr, en]

views: [A2C, A2C_LV, A2C_ZOOM, A3C, A3C_LV, A3C_ZOOM, A4C, A4C_LV, A4C_ZOOM, A5C, A5C_ZOOM, PLAX, PLAX_DEEP,
        PLAX_ZOOM, PSAX, PSAX_AV, RVINF, SUBCOSTAL, SUPRASTERNAL, OTHER]
acquisition_categories: [bmode, color_flow, spectral_doppler, mmode, other, unknown]

view_groups:
  apical_4c: [A4C, A4C_LV, A4C_ZOOM]
  apical_5c: [A5C, A5C_ZOOM]
  apical_2c: [A2C, A2C_LV, A2C_ZOOM]
  apical_3c: [A3C, A3C_LV, A3C_ZOOM]
  parasternal_long: [PLAX, PLAX_DEEP, PLAX_ZOOM]
  parasternal_short: [PSAX]
  parasternal_short_av: [PSAX_AV]
  rv_inflow: [RVINF]
  subcostal: [SUBCOSTAL]
  suprasternal: [SUPRASTERNAL]

view_labels:
  fr:
    A2C: Coupe apicale 2 cavités
    A2C_LV: Coupe apicale 2 cavités centrée sur le VG
    A2C_ZOOM: Coupe apicale 2 cavités zoomée
    A3C: Coupe apicale 3 cavités
    A3C_LV: Coupe apicale 3 cavités centrée sur le VG
    A3C_ZOOM: Coupe apicale 3 cavités zoomée
    A4C: Coupe apicale 4 cavités
    A4C_LV: Coupe apicale 4 cavités centrée sur le VG
    A4C_ZOOM: Coupe apicale 4 cavités zoomée
    A5C: Coupe apicale 5 cavités
    A5C_ZOOM: Coupe apicale 5 cavités zoomée
    PLAX: Coupe parasternale grand axe
    PLAX_DEEP: Coupe parasternale grand axe profonde
    PLAX_ZOOM: Coupe parasternale grand axe zoomée
    PSAX: Coupe parasternale petit axe
    PSAX_AV: Coupe parasternale petit axe aortique
    RVINF: Coupe de la voie d'entrée du VD
    SUBCOSTAL: Coupe sous-costale
    SUPRASTERNAL: Coupe sus-sternale
    OTHER: Coupe non classée
  en:
    A2C: Apical 2-chamber view
    A2C_LV: Apical 2-chamber view, LV-focused
    A2C_ZOOM: Apical 2-chamber view, zoomed
    A3C: Apical 3-chamber view
    A3C_LV: Apical 3-chamber view, LV-focused
    A3C_ZOOM: Apical 3-chamber view, zoomed
    A4C: Apical 4-chamber view
    A4C_LV: Apical 4-chamber view, LV-focused
    A4C_ZOOM: Apical 4-chamber view, zoomed
    A5C: Apical 5-chamber view
    A5C_ZOOM: Apical 5-chamber view, zoomed
    PLAX: Parasternal long-axis view
    PLAX_DEEP: Parasternal long-axis view, deep
    PLAX_ZOOM: Parasternal long-axis view, zoomed
    PSAX: Parasternal short-axis view
    PSAX_AV: Parasternal short-axis view at the aortic valve
    RVINF: Right ventricular inflow view
    SUBCOSTAL: Subcostal view
    SUPRASTERNAL: Suprasternal view
    OTHER: Unclassified view

acquisition_labels:
  fr: {bmode: mode B, color_flow: Doppler couleur, spectral_doppler: Doppler spectral, mmode: mode M,
       other: acquisition autre, unknown: acquisition indéterminée}
  en: {bmode: B-mode, color_flow: color Doppler, spectral_doppler: spectral Doppler, mmode: M-mode,
       other: other acquisition, unknown: unknown acquisition}

# Ordered scales. `aliases` map normalized report values (lower case, accents removed) to scale values. Aliases made
# only of digits and signs ("3") are matched against whole structured column values only, never inside text.
# The ICM "Referring MR/AR/TR/PR Grade" columns mix encodings (0, 0.5, 1, 2, 3, words such as "Trace", and date-like
# strings), so v0 maps no numeric grade code: such values stay unmapped (reported, never read as "none" or zero)
# until the encoding is confirmed with the ICM team and added here under a new ontology version.
# `negated_value` is the value a negated mention ("pas d'insuffisance mitrale") gives; without it, a negated mention
# stays unresolved.
scales:
  regurgitation:
    values: [none, trace, mild, mild_to_moderate, moderate, moderate_to_severe, severe]
    negated_value: none
    labels:
      fr: {none: absente, trace: minime (trace), mild: légère, mild_to_moderate: légère à modérée, moderate: modérée,
           moderate_to_severe: modérée à sévère, severe: sévère}
      en: {none: none, trace: trace, mild: mild, mild_to_moderate: mild to moderate, moderate: moderate,
           moderate_to_severe: moderate to severe, severe: severe}
    aliases:
      none: [aucune, absente, absence, none, absent]
      trace: [trace, traces, minime, trivial, physiologique]
      mild: [legere, leger, mild]
      mild_to_moderate: [legere a moderee, legere-moderee, mild to moderate, mild-moderate]
      moderate: [moderee, modere, moderate]
      moderate_to_severe: [moderee a severe, moderee-severe, moderate to severe, moderate-severe]
      severe: [severe, importante, massive]
  stenosis:
    values: [none, mild, moderate, severe]
    negated_value: none
    labels:
      fr: {none: absente, mild: légère, moderate: modérée, severe: sévère}
      en: {none: none, mild: mild, moderate: moderate, severe: severe}
    aliases:
      none: [aucune, absente, absence, none]
      mild: [legere, leger, mild]
      moderate: [moderee, modere, moderate]
      severe: [severe, serre, critique, critical]
  dilation:
    values: [normal, mild, moderate, severe]
    negated_value: normal
    labels:
      fr: {normal: normale, mild: légèrement augmentée, moderate: modérément augmentée, severe: sévèrement augmentée}
      en: {normal: normal, mild: mildly increased, moderate: moderately increased, severe: severely increased}
    aliases:
      normal: [normal, taille normale, non dilate, dimensions normales]
      mild: [legerement dilat, legere dilatation, leger, mildly, mild]
      moderate: [moderement dilat, moderee, modere, moderately, moderate]
      severe: [severement dilat, severe, importante, tres dilat, severely, marked]
  hypertrophy:
    values: [none, mild, moderate, severe]
    negated_value: none
    labels:
      fr: {none: absente, mild: légère, moderate: modérée, severe: sévère}
      en: {none: none, mild: mild, moderate: moderate, severe: severe}
    aliases:
      none: [absente, aucune, absence, none, normale, normal]
      mild: [legere, leger, mild]
      moderate: [moderee, modere, moderate]
      severe: [severe, importante, marked]
  systolic_function:
    values: [hyperdynamic, normal, mildly_reduced, moderately_reduced, severely_reduced]
    labels:
      fr: {hyperdynamic: hyperdynamique, normal: normale, mildly_reduced: légèrement diminuée,
           moderately_reduced: modérément diminuée, severely_reduced: sévèrement diminuée}
      en: {hyperdynamic: hyperdynamic, normal: normal, mildly_reduced: mildly reduced,
           moderately_reduced: moderately reduced, severely_reduced: severely reduced}
    aliases:
      hyperdynamic: [hyperdynami, hyperkine, hypercontractil]
      normal: [normale, normal, preservee, conservee, preserved]
      mildly_reduced: [legerement diminu, legerement reduit, legerement abaiss, legerement altere,
                       dysfonction legere, mildly]
      moderately_reduced: [moderement diminu, moderement reduit, moderement abaiss, moderement altere,
                           dysfonction moderee, moderately]
      severely_reduced: [severement diminu, severement reduit, severement abaiss, severement altere,
                         dysfonction severe, effondree, severely]
  diastolic_function:
    values: [normal, grade_1, grade_2, grade_3, indeterminate]
    labels:
      fr: {normal: normale, grade_1: dysfonction de grade I, grade_2: dysfonction de grade II,
           grade_3: dysfonction de grade III, indeterminate: indéterminée}
      en: {normal: normal, grade_1: grade I dysfunction, grade_2: grade II dysfunction,
           grade_3: grade III dysfunction, indeterminate: indeterminate}
    aliases:
      normal: [normale, normal]
      grade_1: [grade 1, grade i, trouble de la relaxation, relaxation anormale, impaired relaxation]
      grade_2: [grade 2, grade ii, pseudonormal]
      grade_3: [grade 3, grade iii, restrictif, restrictive]
      indeterminate: [indetermin, indeterminate]
  wall_motion:
    # Worst segment. The digits assume the standard wall-motion score (1 normal ... 5 aneurysmal); the WMS columns'
    # actual encoding is not verified yet and must be checked before extraction from them is trusted.
    values: [normal, hypokinetic, akinetic, dyskinetic, aneurysmal]
    negated_value: normal
    labels:
      fr: {normal: normale, hypokinetic: hypokinésie, akinetic: akinésie, dyskinetic: dyskinésie,
           aneurysmal: anévrisme}
      en: {normal: normal, hypokinetic: hypokinesis, akinetic: akinesis, dyskinetic: dyskinesis,
           aneurysmal: aneurysm}
    aliases:
      normal: [normale, normal, normokine, "1"]
      hypokinetic: [hypokine, hypokinesis, "2"]
      akinetic: [akine, akinesis, "3"]
      dyskinetic: [dyskine, dyskinesis, "4"]
      aneurysmal: [anevrism, aneurysm, "5"]
  effusion:
    values: [none, trivial, small, moderate, large]
    negated_value: none
    labels:
      fr: {none: absent, trivial: minime, small: de faible abondance, moderate: de moyenne abondance,
           large: de grande abondance}
      en: {none: none, trivial: trivial, small: small, moderate: moderate, large: large}
    aliases:
      none: [absent, aucun, none]
      trivial: [minime, trivial, lame]
      small: [faible abondance, petit, small, leger]
      moderate: [moyenne abondance, modere, moderate]
      large: [grande abondance, important, abondant, large, tamponnade]

# Free-text negation cues, searched shortly before a phrase hint in the same sentence.
negation_cues: [pas de, pas d, absence de, absence d, aucun, aucune, sans, ni, no, without, not]

concepts:
  # ------------------------------------------------------------------ structure visibility
  - id: lv_visible
    labels: {fr: Ventricule gauche visible, en: Left ventricle visible}
    structure: left_ventricle
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c, apical_5c, parasternal_long, parasternal_short, SUBCOSTAL]
        acquisitions: [bmode, color_flow]
    notes: Visibility only. Says nothing about LV size or function.

  - id: rv_visible
    labels: {fr: Ventricule droit visible, en: Right ventricle visible}
    structure: right_ventricle
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, apical_5c, parasternal_long, parasternal_short, PSAX_AV, RVINF, SUBCOSTAL]
        acquisitions: [bmode, color_flow]

  - id: la_visible
    labels: {fr: Oreillette gauche visible, en: Left atrium visible}
    structure: left_atrium
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c, apical_5c, parasternal_long, PSAX_AV, SUBCOSTAL]
        acquisitions: [bmode, color_flow]

  - id: ra_visible
    labels: {fr: Oreillette droite visible, en: Right atrium visible}
    structure: right_atrium
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, apical_5c, PSAX_AV, RVINF, SUBCOSTAL]
        acquisitions: [bmode, color_flow]

  - id: mitral_valve_visible
    labels: {fr: Valve mitrale visible, en: Mitral valve visible}
    structure: mitral_valve
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c, apical_5c, parasternal_long, parasternal_short]
        acquisitions: [bmode, color_flow]
    notes: Visibility only; distinct from mitral_regurgitation, mitral_stenosis and mitral_valve_device.

  - id: aortic_valve_visible
    labels: {fr: Valve aortique visible, en: Aortic valve visible}
    structure: aortic_valve
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_5c, apical_3c, parasternal_long, PSAX_AV]
        acquisitions: [bmode, color_flow]

  - id: tricuspid_valve_visible
    labels: {fr: Valve tricuspide visible, en: Tricuspid valve visible}
    structure: tricuspid_valve
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, apical_5c, PSAX_AV, RVINF, SUBCOSTAL]
        acquisitions: [bmode, color_flow]

  - id: pulmonic_valve_visible
    labels: {fr: Valve pulmonaire visible, en: Pulmonic valve visible}
    structure: pulmonic_valve
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [PSAX_AV, SUBCOSTAL]
        acquisitions: [bmode, color_flow]

  - id: aortic_root_visible
    labels: {fr: Racine aortique visible, en: Aortic root visible}
    structure: aorta
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [parasternal_long, apical_5c, apical_3c, PSAX_AV, SUPRASTERNAL]
        acquisitions: [bmode, color_flow]

  - id: interatrial_septum_visible
    labels: {fr: Septum interauriculaire visible, en: Interatrial septum visible}
    structure: interatrial_septum
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow]
    potentially_visible_in:
      - views: [apical_4c, PSAX_AV, SUBCOSTAL]
        acquisitions: [bmode, color_flow]

  - id: pericardium_visible
    labels: {fr: Péricarde visible, en: Pericardium visible}
    structure: pericardium
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c, parasternal_long, parasternal_short, SUBCOSTAL]
        acquisitions: [bmode]

  - id: ivc_visible
    labels: {fr: Veine cave inférieure visible, en: Inferior vena cava visible}
    structure: inferior_vena_cava
    kind: structure_visibility
    value: {type: boolean}
    evidence: visual
    required_modality: [bmode, color_flow, mmode]
    potentially_visible_in:
      - views: [SUBCOSTAL]
        acquisitions: [bmode, color_flow, mmode]

  # ------------------------------------------------------------------ left ventricle
  - id: lv_systolic_function
    labels: {fr: Fonction systolique ventriculaire gauche, en: Left ventricular systolic function}
    structure: left_ventricle
    kind: finding
    value: {type: ordinal, scale: systolic_function}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c, parasternal_long, parasternal_short, SUBCOSTAL]
        acquisitions: [bmode]
    report_sources:
      text_fields: [Left ventricule findings, Report conclusions findings]
      phrase_hints: [fonction systolique ventriculaire gauche, fonction systolique du ventricule gauche,
                     fonction systolique du vg, fonction ventriculaire gauche, dysfonction systolique,
                     left ventricular systolic function, lv systolic function]
      acronyms: [FEVG]
    related_tasks: {panecho: [LVSystolicFunction], echoprime: [ejection_fraction]}

  - id: lv_ejection_fraction
    labels: {fr: Fraction d'éjection VG (estimation visuelle), en: LV ejection fraction (visual estimate)}
    structure: left_ventricle
    kind: finding
    value: {type: numeric, unit: "%", min: 5, max: 90}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, apical_2c]
        acquisitions: [bmode]
    requires_views_from: [apical_4c, apical_2c]
    report_sources:
      columns:
        - {name: Visually Estimated EF, parse: numeric}
    related_tasks: {panecho: [EF], echoprime: [ejection_fraction]}
    notes: A visual estimate integrates apical 4- and 2-chamber views; one clip supports it only partly.

  - id: lv_size
    labels: {fr: Taille du ventricule gauche, en: Left ventricular size}
    structure: left_ventricle
    kind: finding
    value: {type: ordinal, scale: dilation}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, parasternal_long, parasternal_short]
        acquisitions: [bmode]
    report_sources:
      text_fields: [Left ventricule findings, Report conclusions findings]
      phrase_hints: [ventricule gauche dilate, dilatation du ventricule gauche, dilatation ventriculaire gauche,
                     taille du ventricule gauche, left ventricular dilation, left ventricle is dilated]
      acronyms: [VG dilaté]
    related_tasks: {panecho: [LVSize, LVIDd, LVEDV], echoprime: []}

  - id: lv_wall_thickness
    labels: {fr: Hypertrophie ventriculaire gauche, en: Left ventricular hypertrophy}
    structure: left_ventricle
    kind: finding
    value: {type: ordinal, scale: hypertrophy}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [parasternal_long, parasternal_short, apical_4c]
        acquisitions: [bmode]
    report_sources:
      text_fields: [Left ventricule findings, Report conclusions findings]
      phrase_hints: [hypertrophie ventriculaire gauche, hypertrophie du ventricule gauche, hypertrophie septale,
                     hypertrophie concentrique, left ventricular hypertrophy]
      acronyms: [HVG]
    related_tasks: {panecho: [LVWallThickness-increased-any, LVWallThickness-increased-modsev, IVSd, LVPWd],
                    echoprime: []}

  - id: lv_regional_wall_motion
    labels: {fr: Cinétique segmentaire du VG (segment le plus atteint), en: LV regional wall motion (worst segment)}
    structure: left_ventricle
    kind: finding
    value: {type: ordinal, scale: wall_motion}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c, parasternal_short]
        acquisitions: [bmode]
    requires_views_from: [apical_4c, apical_2c, apical_3c]
    report_sources:
      columns:
        # The exact WMS column names are not checked yet; the pattern matches every segment column.
        - {pattern: "WMS*", parse: scale, aggregate: worst}
      text_fields: [Left ventricule findings]
      phrase_hints: [hypokinesie, akinesie, dyskinesie, anevrisme apical, trouble de la cinetique segmentaire,
                     anomalie de la cinetique segmentaire, wall motion abnormality]
    related_tasks: {panecho: [LVWallMotionAbnormalities], echoprime: [wall_motion_hypokinesis]}
    notes: The 17 segments are seen across apical 4-, 2- and 3-chamber views; a single clip covers some segments.

  - id: lv_diastolic_function
    labels: {fr: Fonction diastolique du VG, en: LV diastolic function}
    structure: left_ventricle
    kind: finding
    value: {type: ordinal, scale: diastolic_function}
    evidence: measurement
    required_modality: [spectral_doppler]
    potentially_visible_in:
      - views: [apical_4c]
        acquisitions: [spectral_doppler]
    report_sources:
      text_fields: [Left ventricule findings, Report conclusions findings]
      phrase_hints: [fonction diastolique, profil de remplissage, diastolic function]
    related_tasks: {panecho: [LVDiastolicFunction, E|EAvg], echoprime: []}
    notes: Graded from mitral inflow and tissue Doppler; spectral Doppler stills are not in the video corpus.

  - id: lvot_obstruction
    labels: {fr: Obstruction de la chambre de chasse du VG, en: LV outflow tract obstruction}
    structure: left_ventricular_outflow_tract
    kind: finding
    value: {type: boolean}
    evidence: measurement
    required_modality: [spectral_doppler]
    potentially_visible_in:
      - views: [apical_5c, apical_3c]
        acquisitions: [spectral_doppler]
    report_sources:
      text_fields: [Left ventricule findings, Report conclusions findings]
      phrase_hints: [obstruction de la chambre de chasse, obstruction intraventriculaire, gradient intraventriculaire,
                     lvot obstruction]
      acronyms: [SAM]
    related_tasks: {panecho: [LVOT20mmHg], echoprime: []}

  - id: lv_global_longitudinal_strain
    labels: {fr: Strain longitudinal global du VG, en: LV global longitudinal strain}
    structure: left_ventricle
    kind: finding
    value: {type: numeric, unit: "%", min: -40, max: 0}
    evidence: measurement
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, apical_2c, apical_3c]
        acquisitions: [bmode]
    requires_views_from: [apical_4c, apical_2c, apical_3c]
    report_sources:
      text_fields: [Left ventricule findings]
      phrase_hints: [strain longitudinal global, global longitudinal strain]
      acronyms: [SLG, GLS]
    related_tasks: {panecho: [GLS], echoprime: []}

  # ------------------------------------------------------------------ right ventricle and pressures
  - id: rv_systolic_function
    labels: {fr: Fonction systolique ventriculaire droite, en: Right ventricular systolic function}
    structure: right_ventricle
    kind: finding
    value: {type: ordinal, scale: systolic_function}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, RVINF, parasternal_short, SUBCOSTAL]
        acquisitions: [bmode]
    report_sources:
      columns:
        - {name: MHI VD fonction systolique, parse: scale}
      text_fields: [Report conclusions findings]
      phrase_hints: [fonction systolique ventriculaire droite, fonction systolique du ventricule droit,
                     fonction ventriculaire droite, right ventricular systolic function]
    related_tasks: {panecho: [RVSystolicFunction, RVSVel], echoprime: [rv_systolic_function_depressed]}

  - id: rv_size
    labels: {fr: Taille du ventricule droit, en: Right ventricular size}
    structure: right_ventricle
    kind: finding
    value: {type: ordinal, scale: dilation}
    evidence: visual
    required_modality: [bmode]
    potentially_visible_in:
      - views: [apical_4c, parasternal_long, parasternal_short, SUBCOSTAL]
        acquisitions: [bmode]
    report_sources:
      text_fields: [Report conclusions findings]
      phrase_hints: [ventricule droit dilate, dilatation du ventricule droit, dilatation ventriculaire droite,
                     taille du ventricule droit, right ventricular dilation]
