# RADAR structure routing registry, version 0.
#
# For each cardiac structure: the view classes in which it may be visible (a clip of another view is never pooled
# into its embedding), the report findings column that gives its caption, and whether v0 trains a query for it.
#
# Source: column review v3 (branch issue_21/column_review_v3, commit 5dec44b), `views[*].targets` inverted. Only
# level-free targets are used, because the view classifier predicts no PSAX or subcostal level: generic PSAX is
# therefore not a mitral view, and no view is a strict IVC view. Grouped v3 targets: lv = lv + ivs, aortic =
# aortic + lvot, pulmonic = pulmonic + rvot + pulmonary_artery, aorta = aorta root, ascending, arch and descending.
#
# routing: strict = the source's level-free views; weak = a named override of the source, reported as exploratory.
# train: false keeps a structure in the taxonomy without a query, so it never receives a prediction.
# The interatrial septum is not in v0: adding it needs captions, routing, a trained query and validation.

schema: radar-structure-routing
version: 0

view_classes:  # the view classifier's classes, in id order (app/radar/ontology.py VIEWS)
  - A2C
  - A2C_LV
  - A2C_ZOOM
  - A3C
  - A3C_LV
  - A3C_ZOOM
  - A4C
  - A4C_LV
  - A4C_ZOOM
  - A5C
  - A5C_ZOOM
  - PLAX
  - PLAX_DEEP
  - PLAX_ZOOM
  - PSAX
  - PSAX_AV
  - RVINF
  - SUBCOSTAL
  - SUPRASTERNAL
  - OTHER

# Bag selection only (not routing): a view listed here counts as its family when a study's clips are balanced, so
# near-duplicate views do not use up the clip budget. A view not listed is its own family. PSAX_AV stays apart from
# PSAX on purpose: it is the pulmonic valve's only view, and grouped with PSAX it could lose its place in the bag.
view_families:
  A2C_LV: A2C
  A2C_ZOOM: A2C
  A3C_LV: A3C
  A3C_ZOOM: A3C
  A4C_LV: A4C
  A4C_ZOOM: A4C
  A5C_ZOOM: A5C
  PLAX_DEEP: PLAX
  PLAX_ZOOM: PLAX

structures:
  - name: lv
    label: Left ventricle
    report_column: Left ventricule findings
    routing: strict
    train: true
    views: [A2C, A2C_LV, A2C_ZOOM, A3C, A3C_LV, A3C_ZOOM, A4C, A4C_LV, A4C_ZOOM, A5C, A5C_ZOOM,
            PLAX, PLAX_DEEP, PLAX_ZOOM, PSAX]
  - name: rv
    label: Right ventricle
    report_column: Right ventricule findings
    routing: strict
    train: true
    views: [A4C, A4C_ZOOM, A5C, A5C_ZOOM, PLAX, PLAX_DEEP, PLAX_ZOOM, PSAX, PSAX_AV, RVINF]
  - name: la
    label: Left atrium
    report_column: Left atrial findings
    routing: strict
    train: true
    views: [A2C, A2C_ZOOM, A3C, A3C_ZOOM, A4C, A4C_ZOOM, A5C, A5C_ZOOM, PLAX, PLAX_DEEP, PLAX_ZOOM, PSAX_AV]
  - name: ra
    label: Right atrium
    report_column: Right Atrial findings
    routing: strict
    train: false
    note: Its report column is filled in too few reports to train a query in v0.
    views: [A4C, A4C_ZOOM, A5C, A5C_ZOOM, PSAX_AV, RVINF]
  - name: mitral
    label: Mitral valve
    report_column: Mitral valve findings
    routing: strict
    train: true
    views: [A2C, A2C_LV, A2C_ZOOM, A3C, A3C_LV, A3C_ZOOM, A4C, A4C_LV, A4C_ZOOM, A5C, A5C_ZOOM,
            PLAX, PLAX_DEEP, PLAX_ZOOM]
  - name: aortic
    label: Aortic valve
    report_column: Aortic valve findings
    routing: strict
    train: true
    views: [A3C, A3C_LV, A3C_ZOOM, A5C, A5C_ZOOM, PLAX, PLAX_DEEP, PLAX_ZOOM, PSAX_AV]
  - name: tricuspid
    label: Tricuspid valve
    report_column: Tricuspid valve findings
    routing: strict
    train: true
    views: [A4C, A4C_LV, A4C_ZOOM, A5C, A5C_ZOOM, PSAX_AV, RVINF]
  - name: pulmonic
    label: Pulmonic valve
    report_column: Pulmonary valve findings
    routing: strict
    train: true
    views: [PSAX_AV]
  - name: aorta
    label: Aorta
    report_column: Aorta findings
    routing: strict
    train: true
    views: [A3C, A3C_ZOOM, A5C, A5C_ZOOM, PLAX, PLAX_DEEP, PLAX_ZOOM, SUPRASTERNAL]
  - name: ivc
    label: Inferior vena cava
    report_column: Inferior vena cava findings
    routing: weak
    train: true
    note: >-
      Override. The source shows the IVC only at the subcostal IVC level, which the classifier does not predict, so
      every subcostal clip is routed to it. Results are exploratory.
    views: [SUBCOSTAL]
  - name: pericardium
    label: Pericardium
    report_column: Pericardium findings
    routing: strict
    train: true
    views: [A2C, A2C_ZOOM, A3C, A3C_ZOOM, A4C, A4C_ZOOM, A5C, A5C_ZOOM, PLAX, PLAX_DEEP, PLAX_ZOOM, PSAX]
  - name: hemo
    label: Hemodynamics (RVSP, filling pressures)
    report_column: null
    routing: strict
    train: false
    note: No single location and no B-mode input; it waits for the Doppler stream.
    views: []
