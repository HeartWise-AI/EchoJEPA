# Token cache settings for RADAR v0 (evals/radar_frozen/build_token_cache.py): the frozen V-JEPA 2.1 ViT-B encoder,
# read as the study probe reads it (configs/eval/vitl/study_multitask_deepecho.yaml: 16 frames at step 2, 224 px).
# Pass the encoder file with --checkpoint.

encoder:
  checkpoint: /your_folder/encoder.pt
  module_name: evals.video_classification_frozen.modelcustom.vjepa_2_1_encoder
  pretrain_kwargs:
    encoder:
      model_name: vit_base
      checkpoint_key: target_encoder
      patch_size: 16
      tubelet_size: 2
      uniform_power: true
      use_rope: true
      use_sdpa: true
      img_temporal_dim_size: 1
      interpolate_rope: true
      modality_embedding: true
      n_output_distillation: 1
  wrapper_kwargs:
    max_frames: 128

data:
  frames_per_clip: 16
  frame_step: 2
  resolution: 224
  normalization: null      # ImageNet mean and std, as the probe

cache:
  token_grid: [8, 14, 14]  # 16 frames / tubelet 2, 224 / patch 16: 1,568 tokens per clip
  embed_dim: 768
  dtype: float16           # about 2.4 MB per clip
  use_bfloat16: true
